# CI: runs on every PR. Unit tests + offline eval gate. A prompt change is treated like code.
name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write   # eval result comment on PRs

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt

      - name: Unit tests
        run: pytest -q tests

      - name: Pull versioned eval dataset (DVC)
        if: ${{ vars.USE_DVC == 'true' }}
        run: dvc pull data/patient_messages.csv
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

      - name: Offline eval (mock LLM, no secrets needed)
        run: python -m eval.run_eval --out eval_report.json
        env: {LLM_PROVIDER: mock, APP_VERSION: "${{ github.sha }}"}

      - name: Live-model eval + MLflow tracking (main only)
        if: github.ref == 'refs/heads/main' && vars.LIVE_EVAL == 'true'
        run: python -m eval.run_eval --mlflow --out eval_report_live.json
        env:
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          APP_VERSION: ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: eval-report, path: "eval_report*.json"}

      - name: Comment eval result on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const r = require('./eval_report.json');
            const m = r.metrics;
            const body = `### Triage eval — prompt \`${r.prompt_version}\`: ${r.passed ? '✅ PASS' : '❌ FAIL'}
            | metric | value |
            |---|---|
            | emergency recall | ${m.emergency_recall.toFixed(2)} |
            | urgent+ recall | ${m.urgent_or_higher_recall.toFixed(2)} |
            | accuracy | ${m.accuracy.toFixed(2)} |
            | under-triage | ${m.under_triage_count} |
            | avg cost | $${m.avg_cost_usd.toFixed(5)} |`;
            github.rest.issues.createComment({...context.repo, issue_number: context.issue.number, body});
