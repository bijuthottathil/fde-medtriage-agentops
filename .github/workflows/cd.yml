# CD: after CI passes on main -> build image -> push to ECR -> start canary on EKS.
name: cd
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  id-token: write      # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: medtriage
  CLUSTER: medtriage-eks

jobs:
  deploy:
    # Off until AWS is set up: repo Settings -> Variables -> DEPLOY_ENABLED=true
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: prod          # require manual approval in GitHub environment settings
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.workflow_run.head_sha }}"}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image (tag = git SHA = model/app version)
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --build-arg GIT_SHA=$SHA -t $REG/$ECR_REPO:$SHA .
          docker push $REG/$ECR_REPO:$SHA

      - name: Install kubectl-argo-rollouts
        run: |
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/latest/download/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64 && sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      - name: Apply manifests & start canary
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION
          kubectl apply -f k8s/00-namespace-config.yaml -f k8s/20-analysis.yaml -f k8s/30-autoscaling.yaml
          kubectl apply -f k8s/10-rollout.yaml   # first deploy only creates; later applies are no-ops for image
          kubectl argo rollouts set image medtriage app=$REG/$ECR_REPO:$SHA -n medtriage
          kubectl argo rollouts status medtriage -n medtriage --timeout 30m
