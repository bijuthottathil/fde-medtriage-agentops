# Minimal MLflow tracking server on EKS (experiment tracking + model/prompt registry).
# For production use RDS for the backend store; S3 holds artifacts.
apiVersion: v1
kind: Namespace
metadata: {name: mlops}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mlflow, namespace: mlops}
spec:
  replicas: 1
  selector: {matchLabels: {app: mlflow}}
  template:
    metadata: {labels: {app: mlflow}}
    spec:
      serviceAccountName: default   # annotate with an IRSA role that can write the S3 bucket
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.16.2
          args: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
                 "--backend-store-uri", "sqlite:////mlflow/mlflow.db",
                 "--artifacts-destination", "s3://YOUR-BUCKET/mlflow-artifacts"]
          ports: [{containerPort: 5000}]
          volumeMounts: [{name: data, mountPath: /mlflow}]
      volumes: [{name: data, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: mlflow, namespace: mlops}
spec:
  selector: {app: mlflow}
  ports: [{port: 5000, targetPort: 5000}]
