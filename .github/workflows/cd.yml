# CD: after CI passes on main -> build image -> push to ECR -> start canary on EKS.
name: cd
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  id-token: write      # GitHub OIDC -> AWS role, no long-lived keys
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: medtriage
  CLUSTER: medtriage-eks

jobs:
  deploy:
    # Off until AWS is set up: repo Settings -> Variables -> DEPLOY_ENABLED=true
    if: ${{ github.event.workflow_run.conclusion == 'success' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: prod          # require manual approval in GitHub environment settings
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.event.workflow_run.head_sha }}"}

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image (tag = git SHA = model/app version)
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker build --build-arg GIT_SHA=$SHA -t $REG/$ECR_REPO:$SHA .
          docker push $REG/$ECR_REPO:$SHA

      - name: Install kubectl-argo-rollouts
        run: |
          curl -sLO https://github.com/argoproj/argo-rollouts/releases/download/v1.7.2/kubectl-argo-rollouts-linux-amd64
          chmod +x kubectl-argo-rollouts-linux-amd64 && sudo mv kubectl-argo-rollouts-linux-amd64 /usr/local/bin/kubectl-argo-rollouts

      # Render the real image and account into the manifests BEFORE applying, so the Rollout
      # never sees the IMAGE_TAG placeholder. Changing the image in the Rollout is what starts
      # the canary; applying the same image again is a no-op.
      - name: Apply manifests & start canary
        env:
          REG: ${{ steps.ecr.outputs.registry }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          aws eks update-kubeconfig --name $CLUSTER --region $AWS_REGION
          kubectl kustomize k8s \
            | sed -e "s#image: ACCOUNT_ID\.dkr\.ecr\.us-east-1\.amazonaws\.com/medtriage:IMAGE_TAG#image: $REG/$ECR_REPO:$SHA#" \
                  -e "s#ACCOUNT_ID#$ACCOUNT_ID#g" > rendered.yaml
          if grep -nE 'ACCOUNT_ID|IMAGE_TAG' rendered.yaml; then echo "unfilled placeholder"; exit 1; fi
          kubectl apply -f rendered.yaml
          kubectl argo rollouts status medtriage -n medtriage --timeout 40m
