# Synthetic patient traffic so Prometheus has data for canary analysis. Without traffic the
# analysis can't measure the canary (p95 has no value, emergency share is 0) and every release
# rolls back. Sends through the `medtriage` Service, so the canary gets its pod-count share.
# Cost on Bedrock is near zero: 3 of the 10 messages hit the red-flag rule (no model call) and
# the rest are answered from each pod's LLM cache after the first call.
# Once real patient traffic flows, scale this to 0: kubectl -n medtriage scale deploy/loadgen --replicas=0
apiVersion: v1
kind: ConfigMap
metadata: {name: loadgen, namespace: medtriage}
data:
  loadgen.py: |
    import json, os, random, time, urllib.request
    MSGS = [
        ("P1003", "my face is drooping and speech is slurred"),
        ("P1002", "I have chest pain spreading to my arm"),
        ("P1005", "took too many pills, possible overdose"),
        ("P1001", "my ankles are more swollen than usual"),
        ("P1004", "fever of 102 for three days"),
        ("P1006", "rash on my arm that is getting bigger"),
        ("P1007", "I just feel off today"),
        ("P1008", "can I book my annual physical"),
        ("P1009", "need a refill please"),
        ("P1010", "what are your clinic hours on saturday"),
    ]
    URL = "http://medtriage.medtriage/triage"
    while True:
        pid, msg = random.choice(MSGS)
        req = urllib.request.Request(URL, json.dumps({"patient_id": pid, "message": msg}).encode(),
                                     {"content-type": "application/json"})
        try:
            urllib.request.urlopen(req, timeout=5).read()
        except Exception as e:
            print("err", e, flush=True)
        time.sleep(float(os.getenv("INTERVAL_SECONDS", "1.0")))
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen, namespace: medtriage}
spec:
  replicas: 1
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata: {labels: {app: loadgen}}
    spec:
      containers:
        - name: loadgen
          image: python:3.12-slim
          command: ["python", "/lg/loadgen.py"]
          env: [{name: INTERVAL_SECONDS, value: "1.0"}]   # ~1 req/s
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 200m, memory: 128Mi}}
          securityContext: {runAsNonRoot: true, runAsUser: 65534, readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          volumeMounts: [{name: lg, mountPath: /lg}]
      volumes: [{name: lg, configMap: {name: loadgen}}]
