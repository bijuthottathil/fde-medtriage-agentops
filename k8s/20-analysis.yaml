# Online health checks run during each canary step.
# `or vector(0)`: the error counter has no series until the first error; empty result = analysis error.
# clamp_min(..., 0.001) only guards divide-by-zero (clamping to 1 would skew ratios below 1 req/s).
# Tip: once traffic is meaningful, filter queries by {app_version="<new sha>"} to judge the canary alone.
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: triage-canary-health
  namespace: medtriage
spec:
  metrics:
    - name: error-rate
      interval: 1m
      count: 3
      successCondition: result[0] < 0.02
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring:80
          query: |
            (sum(rate(triage_errors_total[5m])) or vector(0))
            / clamp_min(sum(rate(triage_requests_total[5m])), 0.001)
    - name: p95-latency
      interval: 1m
      count: 3
      successCondition: result[0] < 3
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring:80
          query: |
            histogram_quantile(0.95, sum(rate(triage_latency_seconds_bucket[5m])) by (le))
    - name: emergency-share-drift   # sudden drop in EMERGENCY share = possible under-triage
      interval: 2m
      count: 2
      successCondition: result[0] > 0.03
      failureLimit: 1
      provider:
        prometheus:
          address: http://prometheus-server.monitoring:80
          query: |
            sum(rate(triage_requests_total{label="EMERGENCY"}[30m]))
            / clamp_min(sum(rate(triage_requests_total[30m])), 0.001)
