# Pod autoscaling (HPA) — targets the Argo Rollout.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medtriage
  namespace: medtriage
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: medtriage
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
---
# Node autoscaling + cost: Karpenter on Spot first, On-Demand fallback, Graviton allowed.
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: medtriage-general
spec:
  template:
    spec:
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64", "amd64"]
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: ["c", "m"]
      nodeClassRef: {group: karpenter.k8s.aws, kind: EC2NodeClass, name: default}
  limits: {cpu: "64"}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: medtriage, namespace: medtriage}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: medtriage}}
